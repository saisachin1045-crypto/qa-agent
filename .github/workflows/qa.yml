name: NeatLogs diagnosis QA
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'command = configured NeatLogs runner; reference = standalone baseline only'
        type: choice
        options:
          - command
          - reference
        default: command
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v
  diagnosis-qa:
    concurrency:
      group: qa-regression-history
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEATLOGS_API_KEY: ${{ secrets.NEATLOGS_API_KEY }}
      NEATLOGS_ADAPTER_COMMAND: ${{ vars.NEATLOGS_ADAPTER_COMMAND }}
      NEATLOGS_TARGET_ID: ${{ vars.NEATLOGS_TARGET_ID }}
      QA_DATASET: ${{ vars.QA_DATASET }}
      QA_VERIFIER_COMMAND: ${{ vars.QA_VERIFIER_COMMAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore regression memory
        uses: actions/cache/restore@v4
        with:
          path: .qa/regressions.json
          key: qa-regression-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qa-regression-${{ github.ref_name }}-
      - name: Run configured diagnosis QA
        run: python scripts/run_ci.py
      - name: Save regression memory
        if: always() && hashFiles('.qa/regressions.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .qa/regressions.json
          key: qa-regression-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reports and history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            .qa/regressions.json
          include-hidden-files: true
          if-no-files-found: ignore
