name: QA agent
on:
  push:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v
  live-qa:
    concurrency:
      group: qa-regression-history
      cancel-in-progress: false
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Explain missing credentials
        if: env.OPENAI_API_KEY == ''
        run: echo 'Live QA skipped — configure the OPENAI_API_KEY Actions secret to enable the LLM run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore regression memory
        if: env.OPENAI_API_KEY != ''
        uses: actions/cache/restore@v4
        with:
          path: .qa/regressions.json
          key: qa-regression-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qa-regression-${{ github.ref_name }}-
      - name: Run QA agent
        if: env.OPENAI_API_KEY != ''
        run: python qa_agent.py --output reports
      - name: Save regression memory even when bugs are found
        if: always() && env.OPENAI_API_KEY != '' && hashFiles('.qa/regressions.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .qa/regressions.json
          key: qa-regression-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            .qa/regressions.json
          include-hidden-files: true
          if-no-files-found: ignore
